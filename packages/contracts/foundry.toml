[profile.default]
src            = "contracts"
out            = "out"
libs           = ["dependencies"]
test           = "test"
solc_version   = "0.8.25"
evm_version    = "cancun"      # Required for Flare (go-flare/coreth)
optimizer      = true
optimizer_runs = 200
ffi            = false

[rpc_endpoints]
coston2 = "${COSTON2_RPC_URL}"
flare   = "${FLARE_RPC_URL}"

[etherscan]
coston2 = { key = "${BLOCKSCOUT_KEY}", url = "https://coston2-explorer.flare.network/api" }
